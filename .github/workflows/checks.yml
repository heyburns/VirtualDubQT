name: Linux regressions

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [release-checks, sanitizer-checks]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake git nasm pkg-config python3 python3-dev python3-pip \
            autoconf automake libtool patchelf qt6-base-dev qt6-multimedia-dev \
            libaom-dev libmp3lame-dev libopus-dev libsvtav1enc-dev \
            libvorbis-dev libvpx-dev libx264-dev libx265-dev \
            libdav1d-dev librav1e-dev libxvidcore-dev libtheora-dev libwebp-dev \
            libopenjp2-7-dev libjxl-dev libcodec2-dev libgsm1-dev libtwolame-dev \
            libshine-dev libspeex-dev libsnappy-dev libzimg-dev libasound2-dev \
            libva-dev libvpl-dev libdrm-dev libffmpeg-nvenc-dev libgnutls28-dev \
            zlib1g-dev libbz2-dev liblzma-dev

      - name: Build one pinned private FFmpeg runtime and matching SDK
        run: |
          bash packaging/build-ffmpeg-runtime.sh --jobs 2 \
            --work-dir "${RUNNER_TEMP}/media-sources" --prefix "${RUNNER_TEMP}/media-sdk"
          python3 packaging/assemble-ffmpeg-runtime.py \
            --prefix "${RUNNER_TEMP}/media-sdk" --output "${RUNNER_TEMP}/media-runtime"
          # AviSynth is an independent test fixture, not shipped bundle content.
          # This directory contains no FFmpeg DSOs that could mask our bundle.
          mkdir -p "${RUNNER_TEMP}/external-avisynth"
          cp -a "${RUNNER_TEMP}/media-sdk/lib/"libavisynth.so* "${RUNNER_TEMP}/external-avisynth/"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/external-avisynth" >> "${GITHUB_ENV}"

      - name: Configure and build maintained regressions
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -DVDQT_FFMPEG_BUNDLE="${RUNNER_TEMP}/media-runtime" \
            -DAVISYNTH_INCLUDE_DIR="${RUNNER_TEMP}/media-sdk/include" \
            -DAVISYNTH_LIBRARY="${RUNNER_TEMP}/media-sdk/lib/libavisynth.so"
          cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Run isolated regressions (hardware excluded)
        run: ctest --preset "${{ matrix.preset }}"

      - name: Exercise the actual Release application's codec-tool path
        if: matrix.preset == 'release-checks'
        run: |
          python3 packaging/smoke-runtime.py \
            --application "${GITHUB_WORKSPACE}/build-release-checks/VirtualDubQt" \
            --ffmpeg "${RUNNER_TEMP}/media-runtime/bin/ffmpeg" \
            --ffprobe "${RUNNER_TEMP}/media-runtime/bin/ffprobe" \
            --runtime-ffprobe "${RUNNER_TEMP}/media-runtime/bin/ffprobe" \
            --runtime-path "" \
            --runtime-library-path "${RUNNER_TEMP}/external-avisynth" --check-fast-recompress

      - name: Retain failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.preset }}
          path: build-${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
