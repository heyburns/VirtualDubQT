name: Publish Linux release

# Main builds validate packages without publishing. Only a version tag publishes
# after all three packages pass independent clean-runtime checks.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  BASH_ENV: ${{ github.workspace }}/packaging/release-shell.sh

concurrency:
  group: release-${{ github.ref }}
  # Supersede obsolete main-branch previews, but never interrupt a tagged release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  candidate:
    name: Verify source and locate already validated packages
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.lookup.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and release notes before building or promotion
        run: |
          version=$(sed -n 's/^project(VirtualDubQt VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then test "${GITHUB_REF_NAME}" = "v${version}"; fi
          test -f "packaging/release-notes-v${version}.md"
      - name: Reuse only a successful main-branch build of this exact commit
        id: lookup
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.ref.startsWith('refs/tags/')) return;
            const query = {owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'release.yml', head_sha: context.sha,
              event: 'push', status: 'success', per_page: 50};
            const runs = (await github.rest.actions.listWorkflowRuns(query)).data.workflow_runs;
            for (const run of runs) {
              if (run.head_branch !== 'main' || run.head_sha !== context.sha) continue;
              const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id})).data.artifacts;
              if (['ubuntu-packages', 'fedora-package'].every(name =>
                    artifacts.some(a => a.name === name && !a.expired))) {
                core.setOutput('run-id', String(run.id));
                core.info('Promoting the already tested packages from run ' + run.id);
                return;
              }
            }
            core.info('No reusable exact-commit build; building and testing fresh packages.');

  deb-and-appimage:
    name: AppImage and Ubuntu 24.04 DEB
    needs: candidate
    if: needs.candidate.outputs.run-id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: |
          version=$(sed -n 's/^project(VirtualDubQt VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          test -f "packaging/release-notes-v${version}.md"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake curl desktop-file-utils dpkg-dev file git \
            ninja-build pkg-config python3 python3-dev python3-pip nasm \
            autoconf automake libtool patchelf qt6-base-dev qt6-multimedia-dev \
            libaom-dev libmp3lame-dev libopus-dev libsvtav1enc-dev \
            libvorbis-dev libvpx-dev libx264-dev libx265-dev \
            libdav1d-dev librav1e-dev libxvidcore-dev libtheora-dev libwebp-dev \
            libopenjp2-7-dev libjxl-dev libcodec2-dev libgsm1-dev libtwolame-dev \
            libshine-dev libspeex-dev libsnappy-dev libzimg-dev libasound2-dev \
            libva-dev libvpl-dev libdrm-dev libffmpeg-nvenc-dev libgnutls28-dev \
            zlib1g-dev libbz2-dev liblzma-dev
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - name: Reuse matched runtime and its corresponding sources
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: .release-media
          key: ubuntu24-release-media-v1-${{ hashFiles('packaging/ffmpeg-runtime.json', 'packaging/build-ffmpeg-runtime.sh', 'packaging/assemble-ffmpeg-runtime.py', 'packaging/ffmpeg_runtime_policy.py', 'packaging/ffmpeg-runtime-launcher', 'packaging/ffmpeg-vapoursynth-optional.patch', 'packaging/collect-release-sources.py') }}

      - name: Build private FFmpeg and collect exact dependency sources
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          bash packaging/build-ffmpeg-runtime.sh --jobs 2 \
            --work-dir "${RUNNER_TEMP}/media-sources" --prefix "${RUNNER_TEMP}/media-sdk"
          mkdir -p .release-media/external-avisynth/lib .release-media/external-avisynth/include
          cp -a "${RUNNER_TEMP}/media-sdk/lib/"libavisynth.so* .release-media/external-avisynth/lib/
          cp -a "${RUNNER_TEMP}/media-sdk/include/avisynth" .release-media/external-avisynth/include/
          python3 packaging/assemble-ffmpeg-runtime.py --prefix "${RUNNER_TEMP}/media-sdk" \
            --output "${GITHUB_WORKSPACE}/.release-media/runtime"
          python3 packaging/collect-release-sources.py --payload .release-media/runtime \
            --notices .release-media/runtime/licenses --sources .release-media/sources \
            --ffmpeg-source "${RUNNER_TEMP}/media-sources/ffmpeg" \
            --ffmpeg-build "${RUNNER_TEMP}/media-sources/ffmpeg-build"

      - name: Save validated media SDK independently of package deployment
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .release-media
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

      - name: Validate private runtime and configure application
        run: |
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/.release-media/external-avisynth/lib" >> "${GITHUB_ENV}"
          python3 packaging/verify-ffmpeg-runtime.py --runtime .release-media/runtime
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTING=ON \
            -DVDQT_FFMPEG_BUNDLE="${GITHUB_WORKSPACE}/.release-media/runtime" \
            -DAVISYNTH_INCLUDE_DIR="${GITHUB_WORKSPACE}/.release-media/external-avisynth/include" \
            -DAVISYNTH_LIBRARY="${GITHUB_WORKSPACE}/.release-media/external-avisynth/lib/libavisynth.so"
          cmake --build build-release --parallel 2
          desktop-file-validate packaging/virtualdubqt.desktop

      - name: Run maintained regressions without physical hardware
        env:
          QT_QPA_PLATFORM: offscreen
          VD_DISABLE_AUDIO_OUTPUT: "1"
        run: ctest --test-dir build-release --output-on-failure --parallel 2 -LE hardware

      - name: Build Ubuntu DEB
        # Explicit target-distro dependencies avoid requesting system FFmpeg or
        # inventing a distro package for the separately installed AviSynth SDK.
        run: |
          mkdir -p dist
          cpack -G DEB -B dist --config build-release/CPackConfig.cmake \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=OFF \
            -D "CPACK_DEBIAN_PACKAGE_DEPENDS=libc6 (>= 2.38), libstdc++6 (>= 13), libgcc-s1, libqt6core6t64, libqt6gui6t64, libqt6widgets6t64, libqt6multimedia6, libqt6dbus6t64, libqt6concurrent6t64, libasound2t64, libva2, libva-drm2, libdrm2, libcairo2, libgl1, libegl1, ca-certificates"
          dpkg-deb --info dist/*.deb

      - name: Validate DEB in a clean Ubuntu runtime
        run: |
          docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" ubuntu:24.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --no-install-recommends -y python3 /repo/dist/*.deb
            export LD_LIBRARY_PATH=/repo/.release-media/external-avisynth/lib
            /usr/bin/VirtualDubQt --runtime-info
            python3 /repo/packaging/smoke-runtime.py --application /usr/bin/VirtualDubQt \
              --ffmpeg /usr/lib/virtualdubqt/ffmpeg-runtime/bin/ffmpeg \
              --ffprobe /usr/lib/virtualdubqt/ffmpeg-runtime/bin/ffprobe \
              --runtime-ffprobe /usr/lib/virtualdubqt/ffmpeg-runtime/bin/ffprobe \
              --runtime-library-path "$LD_LIBRARY_PATH" --check-fast-recompress
          '

      - name: Build AppImage without bundling script frameworks
        run: |
          bash packaging/build-appimage.sh build-release .release-media/runtime .release-media/sources \
            "${GITHUB_WORKSPACE}/dist/VirtualDubQT-${VERSION}-x86_64.AppImage"
          tar -cJf "dist/VirtualDubQT-${VERSION}-third-party-sources.tar.xz" -C .release-media/sources .
          tar -cJf "dist/VirtualDubQT-${VERSION}-ffmpeg-sdk-x86_64.tar.xz" -C .release-media/runtime .

      - name: Validate AppImage in a clean Ubuntu runtime
        run: |
          docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" --env VERSION ubuntu:24.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --no-install-recommends -y python3 libgl1 libegl1 libopengl0 \
              libdbus-1-3 libfontconfig1 libharfbuzz0b libfribidi0 libasound2t64 \
              libva2 libva-drm2 libdrm2 libcairo2 libsm6 libice6 libxcb-cursor0 libxcb-icccm4 \
              libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
              libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
            test ! -e /usr/bin/ffmpeg
            export LD_LIBRARY_PATH=/repo/.release-media/external-avisynth/lib
            test_root=$(mktemp -d)
            cd "$test_root"
            "/repo/dist/VirtualDubQT-${VERSION}-x86_64.AppImage" --appimage-extract > /dev/null
            # Check the real window-system plugin even in this headless test.
            xcb=$(find "$test_root/squashfs-root" -name libqxcb.so -print -quit)
            test -n "$xcb"
            if ldd "$xcb" | grep -q 'not found'; then ldd "$xcb"; exit 1; fi
            media="$test_root/squashfs-root/usr/lib/virtualdubqt/ffmpeg-runtime/bin"
            python3 /repo/packaging/smoke-runtime.py \
              --application "/repo/dist/VirtualDubQT-${VERSION}-x86_64.AppImage" \
              --ffmpeg "$media/ffmpeg" --ffprobe "$media/ffprobe" --runtime-ffprobe "$media/ffprobe" \
              --runtime-library-path "$LD_LIBRARY_PATH" --check-fast-recompress
          '

      - name: Archive exact SDK and external test-only AviSynth fixture
        run: tar -cJf media-sdk.tar.xz -C .release-media runtime external-avisynth
      - uses: actions/upload-artifact@v4
        with:
          name: media-sdk
          path: media-sdk.tar.xz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-diagnostics
          path: build-release/Testing/Temporary/

  rpm:
    name: Fedora 43 RPM
    needs: deb-and-appimage
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: media-sdk
      - name: Install compiler and Qt
        run: dnf install -y cmake file gcc-c++ ninja-build qt6-qtbase-devel qt6-qtmultimedia-devel python3 rpm-build xz tar
      - name: Build RPM against the same private backend
        shell: bash
        run: |
          mkdir media dist
          tar -xJf media-sdk.tar.xz -C media
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib64 -DBUILD_TESTING=OFF \
            -DVDQT_FFMPEG_BUNDLE="$PWD/media/runtime" \
            -DAVISYNTH_INCLUDE_DIR="$PWD/media/external-avisynth/include" \
            -DAVISYNTH_LIBRARY="$PWD/media/external-avisynth/lib/libavisynth.so"
          cmake --build build-release --parallel 2
          cpack -G RPM -B dist --config build-release/CPackConfig.cmake \
            -D CPACK_RPM_PACKAGE_AUTOREQPROV=OFF \
            -D "CPACK_RPM_PACKAGE_REQUIRES=glibc >= 2.38, libstdc++, libgcc, qt6-qtbase >= 6.10, qt6-qtmultimedia >= 6.10, alsa-lib, libva, libdrm, cairo, mesa-libGL, mesa-libEGL, ca-certificates"
          rpm -qpi dist/*.rpm
          rpm -qpR dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  rpm-runtime:
    name: Clean Fedora 43 runtime
    needs: rpm
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fedora-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: media-sdk
      - name: Install only runtime dependencies and the independent framework fixture
        shell: bash
        run: |
          dnf install -y python3 xz tar dist/*.rpm
          mkdir media
          tar -xJf media-sdk.tar.xz -C media
          export LD_LIBRARY_PATH="$PWD/media/external-avisynth/lib"
          # Also record startup output directly: a loader-policy rejection must
          # not be lost behind package-manager progress output in the log.
          python3 -c 'import subprocess,sys; p=subprocess.run(["/usr/bin/VirtualDubQt", "--runtime-info"],capture_output=True,text=True); message=(p.stdout+p.stderr).replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print(("::error" if p.returncode else "::notice")+" title=Installed Fedora backend::"+message,flush=True); sys.exit(p.returncode)'
          python3 packaging/smoke-runtime.py --application /usr/bin/VirtualDubQt \
            --ffmpeg /usr/lib64/virtualdubqt/ffmpeg-runtime/bin/ffmpeg \
            --ffprobe /usr/lib64/virtualdubqt/ffmpeg-runtime/bin/ffprobe \
            --runtime-ffprobe /usr/lib64/virtualdubqt/ffmpeg-runtime/bin/ffprobe \
            --runtime-library-path "$LD_LIBRARY_PATH" --check-fast-recompress

  publish:
    name: Publish GitHub release
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      (needs.candidate.outputs.run-id != '' ||
       (needs.deb-and-appimage.result == 'success' && needs.rpm-runtime.result == 'success'))
    needs: [candidate, deb-and-appimage, rpm-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-packages
          path: dist
          run-id: ${{ needs.candidate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: fedora-package
          path: dist
          run-id: ${{ needs.candidate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Checksum and publish only validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.AppImage *.deb *.rpm *.tar.xz > SHA256SUMS
          cd ..
          gh release create "${GITHUB_REF_NAME}" dist/* --title "VirtualDubQT ${GITHUB_REF_NAME}" \
            --notes-file "packaging/release-notes-${GITHUB_REF_NAME}.md" --verify-tag
